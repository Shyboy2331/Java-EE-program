<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师首页 - 考勤系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            color: #11998e;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .user-name {
            color: #333;
            font-size: 15px;
            font-weight: 600;
        }

        .role-badge {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        /* 主体内容区 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 欢迎卡片 */
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .welcome-card h1 {
            color: #11998e;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
        }

        .datetime {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
        }

        /* 功能卡片区 */
        .function-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .function-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 35px;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: block;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .function-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .function-card .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .function-card .title {
            color: #333;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .function-card .desc {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }

        .function-card.create {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .function-card.create .title,
        .function-card.create .desc,
        .function-card.create .icon {
            color: white;
        }

        .function-card.records {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .function-card.records .title,
        .function-card.records .desc,
        .function-card.records .icon {
            color: white;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-card .stat-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-card .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #11998e;
        }

        .stat-card .stat-label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 最近课程 */
        .recent-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        /* 统计区块间距 */
        .stats-section + .stats-section {
            margin-top: 30px;
        }

        .recent-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .empty-state .btn {
            display: inline-block;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .empty-state .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        /* 统计表格 */
        .stats-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .stats-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stats-tabs {
            display: flex;
            gap: 10px;
        }

        .stats-tab {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .stats-tab:hover {
            border-color: #11998e;
            color: #11998e;
        }

        .stats-tab.active {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border-color: transparent;
        }

        .chart-type-btn.active {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .chart-container {
            margin-top: 20px;
            position: relative;
            height: 350px;
            width: 100%;
        }

        .chart-controls {
            display: none;
            gap: 10px;
            justify-content: center;
        }

        .chart-controls.show {
            display: flex;
        }

        .chart-type-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .chart-type-btn:hover {
            border-color: #11998e;
        }

        .chart-type-btn.active {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <a href="/teacher/homepage" class="navbar-brand">
            <span>👨‍🏫</span>
            <span>教师考勤管理</span>
        </a>
        <div class="navbar-right">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <span class="user-name" id="userName">教师</span>
                <span class="role-badge">教师</span>
            </div>
            <button class="logout-btn" onclick="logout()">
                <span>🚪</span>
                <span>退出登录</span>
            </button>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="main-container">
        <!-- 欢迎卡片 -->
        <div class="welcome-card">
            <h1>👋 欢迎回来，老师！</h1>
            <p>管理您的课程和学生考勤情况</p>
            <div class="datetime" id="datetime"></div>
        </div>

        <!-- 功能卡片 -->
        <div class="function-grid">
            <a href="/teacher/course/create" class="function-card create">
                <div class="icon">➕</div>
                <div class="title">创建课程</div>
                <div class="desc">创建新的课程班级，管理学生选课</div>
            </a>
            <a href="/tch-sign-list" class="function-card records">
                <div class="icon">📋</div>
                <div class="title">学生打卡记录</div>
                <div class="desc">查看所有学生的打卡记录和考勤统计</div>
            </a>
            <a href="/student/list-page" class="function-card">
                <div class="icon">👨‍🎓</div>
                <div class="title">学生管理</div>
                <div class="desc">查看和管理所有学生信息</div>
            </a>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-value" id="courseCount">0</div>
                <div class="stat-label">课程数量</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👨‍🎓</div>
                <div class="stat-value" id="studentCount">0</div>
                <div class="stat-label">学生总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="attendanceRate">0%</div>
                <div class="stat-label">今日出勤率</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-value" id="todaySignCount">0</div>
                <div class="stat-label">今日打卡数</div>
            </div>
        </div>

        <!-- 最近课程 -->
        <div class="recent-section">
            <h3>📚 最近课程</h3>
            <div class="empty-state" id="noCourseState">
                <div class="icon">📚</div>
                <p>您还没有创建任何课程</p>
                <a href="/teacher/course/create" class="btn">创建第一个课程</a>
            </div>
        </div>

        <!-- 按周/月统计 -->
        <div class="stats-section">
            <h3>📊 出勤率统计</h3>
            <div class="stats-header">
                <div class="stats-tabs">
                    <div class="stats-tab active" onclick="switchPeriod('week')">按周统计</div>
                    <div class="stats-tab" onclick="switchPeriod('month')">按月统计</div>
                </div>
            </div>
            <div class="chart-container" id="periodChartContainer" style="height: 350px;">
                <canvas id="periodChart"></canvas>
            </div>
            <div class="chart-controls" id="periodChartControls" style="margin-top: 15px;">
                <button class="chart-type-btn active" onclick="setChartType('bar')">柱状图</button>
                <button class="chart-type-btn" onclick="setChartType('line')">折线图</button>
                <button class="chart-type-btn" onclick="setChartType('pie')">饼状图</button>
            </div>
        </div>

        <!-- 班级统计 -->
        <div class="stats-section">
            <h3>👨‍🎓 班级出勤统计</h3>
            <div class="chart-container" id="classChartContainer" style="height: 350px;">
                <canvas id="classChart"></canvas>
            </div>
            <div class="chart-controls" id="classChartControls" style="margin-top: 15px;">
                <button class="chart-type-btn active" onclick="setClassChartType('bar')">柱状图</button>
                <button class="chart-type-btn" onclick="setClassChartType('pie')">饼状图</button>
            </div>
        </div>
    </div>

    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // 显示当前日期时间
        function updateDateTime() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('datetime').textContent = now.toLocaleDateString('zh-CN', options);
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // 全局变量
        let periodChart = null;
        let classChart = null;
        let currentPeriod = 'week';
        let currentChartType = 'bar';
        let currentClassChartType = 'bar';
        let periodStatsData = [];
        let classStatsData = [];

        // 加载用户信息
        document.addEventListener('DOMContentLoaded', function() {
            // 从 Session 获取用户信息
            fetch('/student/api/current-user')
                .then(res => res.json())
                .then(result => {
                    if (result.code === 200 && result.data) {
                        const user = result.data;
                        const realName = user.real_name || user.realName || user.username || '教师';
                        document.getElementById('userName').textContent = realName;
                        
                        // 保存到 localStorage 供其他功能使用
                        localStorage.setItem('user', JSON.stringify(user));
                    }
                    // 加载统计数据
                    loadSummaryStats();
                    loadPeriodStats();
                    loadClassStats();
                })
                .catch(err => {
                    console.error('获取用户信息失败', err);
                    // 未登录跳转到提示页面
                    window.location.href = '/need-login';
                });
        });

        // 加载汇总统计
        function loadSummaryStats() {
            fetch('/api/stats/summary')
                .then(res => res.json())
                .then(result => {
                    if (result.code === 200 && result.data) {
                        const data = result.data;
                        document.getElementById('courseCount').textContent = data.classCount || 0;
                        document.getElementById('studentCount').textContent = data.totalStudents || 0;
                        document.getElementById('attendanceRate').textContent = (data.attendanceRate || 0).toFixed(1) + '%';
                        document.getElementById('todaySignCount').textContent = data.todaySignCount || 0;
                    }
                })
                .catch(err => console.error('加载统计数据失败', err));
        }

        // 加载周期统计
        function loadPeriodStats() {
            const url = currentPeriod === 'week'
                ? '/api/stats/weekly?weekOffset=0'
                : '/api/stats/monthly?monthOffset=0';

            fetch(url)
                .then(res => res.json())
                .then(result => {
                    if (result.code === 200) {
                        periodStatsData = result.data || [];
                        renderPeriodChart();
                    }
                })
                .catch(err => console.error('加载周期统计失败', err));
        }

        // 加载班级统计
        function loadClassStats() {
            fetch('/api/stats/class')
                .then(res => res.json())
                .then(result => {
                    if (result.code === 200) {
                        classStatsData = result.data || [];
                        renderClassChart();
                    }
                })
                .catch(err => console.error('加载班级统计失败', err));
        }

        // 渲染周期图表
        function renderPeriodChart() {
            const ctx = document.getElementById('periodChart');
            if (!ctx || !periodStatsData || periodStatsData.length === 0) return;
            
            if (periodChart) {
                periodChart.destroy();
            }
            
            const labels = periodStatsData.map(item => item.period);
            const attendanceData = periodStatsData.map(item => item.attendanceRate);
            const normalData = periodStatsData.map(item => item.actualDays - item.lateCount);
            const lateData = periodStatsData.map(item => item.lateCount);
            
            if (currentChartType === 'pie') {
                // 饼状图只显示出勤率分布
                const goodCount = periodStatsData.filter(item => item.attendanceRate >= 80).length;
                const normalCount = periodStatsData.filter(item => item.attendanceRate >= 60 && item.attendanceRate < 80).length;
                const badCount = periodStatsData.filter(item => item.attendanceRate < 60).length;
                
                periodChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['优秀 (≥80%)', '一般 (60-80%)', '较差 (<60%)'],
                        datasets: [{
                            data: [goodCount, normalCount, badCount],
                            backgroundColor: ['#28a745', '#ffc107', '#dc3545']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            } else {
                periodChart = new Chart(ctx, {
                    type: currentChartType,
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '出勤率 (%)',
                                data: attendanceData,
                                backgroundColor: 'rgba(17, 153, 142, 0.7)',
                                borderColor: '#11998e',
                                borderWidth: 2,
                                yAxisID: 'y',
                                tension: 0.3
                            },
                            {
                                label: '正常打卡',
                                data: normalData,
                                backgroundColor: 'rgba(76, 175, 80, 0.7)',
                                borderColor: '#4caf50',
                                borderWidth: 2,
                                yAxisID: 'y1',
                                tension: 0.3
                            },
                            {
                                label: '迟到',
                                data: lateData,
                                backgroundColor: 'rgba(255, 193, 7, 0.7)',
                                borderColor: '#ffc107',
                                borderWidth: 2,
                                yAxisID: 'y1',
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                min: 0,
                                max: 100,
                                title: { display: true, text: '出勤率 (%)' }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                min: 0,
                                grid: { drawOnChartArea: false },
                                title: { display: true, text: '人数' }
                            }
                        }
                    }
                });
            }
        }

        // 渲染班级图表
        function renderClassChart() {
            const ctx = document.getElementById('classChart');
            if (!ctx || !classStatsData || classStatsData.length === 0) return;
            
            if (classChart) {
                classChart.destroy();
            }
            
            const labels = classStatsData.map(item => item.className);
            const attendanceData = classStatsData.map(item => item.todayAttendanceRate);
            const signCountData = classStatsData.map(item => item.todaySignCount);
            
            if (currentClassChartType === 'pie') {
                const goodCount = classStatsData.filter(item => item.todayAttendanceRate >= 80).length;
                const normalCount = classStatsData.filter(item => item.todayAttendanceRate >= 60 && item.todayAttendanceRate < 80).length;
                const badCount = classStatsData.filter(item => item.todayAttendanceRate < 60).length;
                
                classChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['优秀 (≥80%)', '一般 (60-80%)', '较差 (<60%)'],
                        datasets: [{
                            data: [goodCount, normalCount, badCount],
                            backgroundColor: ['#28a745', '#ffc107', '#dc3545']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            } else {
                classChart = new Chart(ctx, {
                    type: currentClassChartType,
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '出勤率 (%)',
                                data: attendanceData,
                                backgroundColor: 'rgba(102, 126, 234, 0.7)',
                                borderColor: '#667eea',
                                borderWidth: 2,
                                yAxisID: 'y',
                                tension: 0.3
                            },
                            {
                                label: '打卡人数',
                                data: signCountData,
                                backgroundColor: 'rgba(111, 66, 193, 0.7)',
                                borderColor: '#6f42c1',
                                borderWidth: 2,
                                yAxisID: 'y1',
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                min: 0,
                                max: 100,
                                title: { display: true, text: '出勤率 (%)' }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                min: 0,
                                grid: { drawOnChartArea: false },
                                title: { display: true, text: '人数' }
                            }
                        }
                    }
                });
            }
        }

        // 切换周期
        function switchPeriod(period) {
            currentPeriod = period;
            document.querySelectorAll('.stats-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            loadPeriodStats();
        }

        // 设置图表类型
        function setChartType(type) {
            currentChartType = type;
            document.querySelectorAll('#periodChartControls .chart-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderPeriodChart();
        }

        // 设置班级图表类型
        function setClassChartType(type) {
            currentClassChartType = type;
            document.querySelectorAll('#classChartControls .chart-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderClassChart();
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 调用后端 API 清除 Session
                fetch('/student/api/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
                    }
                }).catch(err => console.error('退出登录失败', err));
                
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                localStorage.removeItem('userRole');
                localStorage.removeItem('loginTime');
                window.location.href = '/login';
            }
        }
    </script>
</body>
