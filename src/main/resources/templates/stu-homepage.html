<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生首页 - 考勤系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            color: #667eea;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .user-name {
            color: #333;
            font-size: 15px;
            font-weight: 600;
        }

        .role-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        /* 主体内容区 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 欢迎卡片 */
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .welcome-card h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
        }

        .datetime {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
        }

        /* 功能卡片区 */
        .function-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .function-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 35px;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: block;
            cursor: pointer;
            border: none;
            width: 100%;
            text-align: center;
        }

        .function-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .function-card .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .function-card .title {
            color: #333;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .function-card .desc {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }

        /* 特殊功能卡片样式 */
        .function-card.sign-in {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .function-card.sign-in .title,
        .function-card.sign-in .desc,
        .function-card.sign-in .icon {
            color: white;
        }

        .function-card.course {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .function-card.course .title,
        .function-card.course .desc,
        .function-card.course .icon {
            color: white;
        }

        .function-card.leave {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .function-card.leave .title,
        .function-card.leave .desc,
        .function-card.leave .icon {
            color: white;
        }

        .function-card.records {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .function-card.records .title,
        .function-card.records .desc,
        .function-card.records .icon {
            color: white;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card .stat-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-card .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-card .stat-label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 我的课程 */
        .courses-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .courses-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .empty-state .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .empty-state .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* 统计表格 */
        .stats-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .stats-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-range-picker {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .date-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .date-input-group label {
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        .date-input {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .query-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .query-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .quick-dates {
            display: flex;
            gap: 8px;
        }

        .quick-date-btn {
            padding: 6px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .quick-date-btn:hover {
            border-color: #667eea;
        }

        .quick-date-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .data-table th {
            background: #f8f9ff;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .data-table tr:hover {
            background: #f8f9ff;
        }

        .data-table td {
            font-size: 14px;
            color: #666;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.good {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.warning {
            background: #fff3cd;
            color: #856404;
        }

        .table-container {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .summary-label {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <a href="/student/homepage" class="navbar-brand">
            <span>📚</span>
            <span>学生考勤系统</span>
        </a>
        <div class="navbar-right">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <span class="user-name" id="userName">学生</span>
                <span class="role-badge">学生</span>
            </div>
            <button class="logout-btn" onclick="logout()">
                <span>🚪</span>
                <span>退出登录</span>
            </button>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="main-container">
        <!-- 欢迎卡片 -->
        <div class="welcome-card">
            <h1>👋 你好，同学！</h1>
            <p>开始今天的考勤打卡吧</p>
            <div class="datetime" id="datetime"></div>
        </div>

        <!-- 功能卡片 -->
        <div class="function-grid">
            <a href="/student/sign-in" class="function-card sign-in">
                <div class="icon">📍</div>
                <div class="title">打卡签到</div>
                <div class="desc">进行每日考勤打卡</div>
            </a>
            <a href="/student/course/select" class="function-card course">
                <div class="icon">📚</div>
                <div class="title">选择课程</div>
                <div class="desc">选择你要修读的课程</div>
            </a>
            <a href="/student/ask-for-leave" class="function-card leave">
                <div class="icon">📝</div>
                <div class="title">请假申请</div>
                <div class="desc">提交请假申请</div>
            </a>
            <a href="/student/sign-records" class="function-card records">
                <div class="icon">📋</div>
                <div class="title">打卡记录</div>
                <div class="desc">查看我的打卡历史</div>
            </a>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-value" id="courseCount">0</div>
                <div class="stat-label">我的课程</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="totalSignCount">0</div>
                <div class="stat-label">累计打卡</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="monthSignCount">0</div>
                <div class="stat-label">本月打卡</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="attendanceRate">0%</div>
                <div class="stat-label">出勤率</div>
            </div>
        </div>

        <!-- 我的课程 -->
        <div class="courses-section">
            <h3>📚 我的课程</h3>
            <div class="empty-state" id="noCourseState">
                <div class="icon">📚</div>
                <p>您还没有选择任何课程</p>
                <a href="/student/course/select" class="btn">选择课程</a>
            </div>
        </div>

        <!-- 考勤统计 -->
        <div class="stats-section">
            <h3>📅 我的考勤记录</h3>
            <div class="date-range-picker">
                <div class="date-input-group">
                    <label>开始日期：</label>
                    <input type="date" id="startDate" class="date-input">
                </div>
                <div class="date-input-group">
                    <label>结束日期：</label>
                    <input type="date" id="endDate" class="date-input">
                </div>
                <button class="query-btn" onclick="queryAttendance()">🔍 查询</button>
                <div class="quick-dates">
                    <button class="quick-date-btn active" onclick="setQuickDate('today')">今天</button>
                    <button class="quick-date-btn" onclick="setQuickDate('week')">本周</button>
                    <button class="quick-date-btn" onclick="setQuickDate('month')">本月</button>
                </div>
            </div>
            <div class="stats-summary" id="statsSummary">
                <div class="summary-item">
                    <div class="summary-value" id="totalDays">0</div>
                    <div class="summary-label">总天数</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="normalDays">0</div>
                    <div class="summary-label">正常</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="lateDays">0</div>
                    <div class="summary-label">迟到</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="attendanceRate">0%</div>
                    <div class="summary-label">出勤率</div>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>课程</th>
                            <th>上课时间</th>
                            <th>打卡时间</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr><td colspan="5" style="text-align:center;color:#888;">请选择日期范围后查询</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 显示当前日期时间
        function updateDateTime() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('datetime').textContent = now.toLocaleDateString('zh-CN', options);
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // 全局变量
        let attendanceStatsData = [];

        // 加载用户信息
        document.addEventListener('DOMContentLoaded', function() {
            // 从 Session 获取用户信息
            fetch('/student/api/current-user')
                .then(res => res.json())
                .then(result => {
                    if (result.code === 200 && result.data) {
                        const user = result.data;
                        const realName = user.real_name || user.realName || user.username || '学生';
                        document.getElementById('userName').textContent = realName;
                        
                        // 保存到 localStorage 供其他功能使用
                        localStorage.setItem('studentId', user.username);
                        localStorage.setItem('user', JSON.stringify(user));
                    }
                    // 设置默认日期范围为今天
                    setQuickDate('today');
                    // 加载统计数据
                    loadStudentStats();
                })
                .catch(err => {
                    console.error('获取用户信息失败', err);
                    // 未登录跳转到提示页面
                    window.location.href = '/need-login';
                });
        });

        // 加载学生统计
        function loadStudentStats() {
            fetch('/api/stats/summary?studentId=' + (localStorage.getItem('studentId') || ''))
                .then(res => res.json())
                .then(result => {
                    if (result.code === 200 && result.data) {
                        const data = result.data;
                        document.getElementById('courseCount').textContent = data.courseCount || 0;
                        document.getElementById('totalSignCount').textContent = data.totalSignCount || 0;
                        document.getElementById('monthSignCount').textContent = data.monthSignCount || 0;
                        document.getElementById('attendanceRate').textContent = (data.attendanceRate || 0).toFixed(1) + '%';
                    }
                })
                .catch(err => console.error('加载统计数据失败', err));
        }

        // 设置快捷日期
        function setQuickDate(type) {
            const today = new Date();
            let startDate, endDate;
            
            // 更新按钮状态
            document.querySelectorAll('.quick-date-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (type === 'today') {
                startDate = new Date(today);
                endDate = new Date(today);
            } else if (type === 'week') {
                const dayOfWeek = today.getDay();
                const diff = today.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
                startDate = new Date(today.setDate(diff));
                endDate = new Date();
            } else if (type === 'month') {
                startDate = new Date(today.getFullYear(), today.getMonth(), 1);
                endDate = new Date();
            }
            
            document.getElementById('startDate').value = formatDate(startDate);
            document.getElementById('endDate').value = formatDate(endDate);
            
            // 自动查询
            queryAttendance();
        }

        // 格式化日期
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 查询考勤记录
        function queryAttendance() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const studentId = localStorage.getItem('studentId') || '';
            
            if (!startDate || !endDate) {
                alert('请选择日期范围');
                return;
            }
            
            if (!studentId) {
                alert('未找到学生 ID，请重新登录');
                return;
            }
            
            const url = `/api/stats/student?studentId=${encodeURIComponent(studentId)}&startDate=${startDate}&endDate=${endDate}`;
            
            fetch(url)
                .then(res => res.json())
                .then(result => {
                    if (result.code === 200) {
                        attendanceStatsData = result.data || [];
                        renderAttendanceTable();
                        updateStatsSummary();
                    }
                })
                .catch(err => {
                    console.error('查询考勤记录失败', err);
                    document.getElementById('attendanceTableBody').innerHTML = 
                        '<tr><td colspan="5" style="text-align:center;color:#dc3545;">查询失败，请稍后重试</td></tr>';
                });
        }

        // 渲染考勤表格
        function renderAttendanceTable() {
            const tbody = document.getElementById('attendanceTableBody');
            
            if (!attendanceStatsData || attendanceStatsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">该日期范围内无考勤记录</td></tr>';
                return;
            }
            
            let html = '';
            attendanceStatsData.forEach(item => {
                const statusClass = item.status === 1 ? 'good' : 'warning';
                const statusText = item.status === 1 ? '正常' : '迟到';
                
                html += `<tr>
                    <td>${item.date}</td>
                    <td>${item.courseName}</td>
                    <td>${item.classTime || '-'}</td>
                    <td>${item.signTime || '-'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // 更新统计摘要
        function updateStatsSummary() {
            const total = attendanceStatsData.length;
            const normal = attendanceStatsData.filter(item => item.status === 1).length;
            const late = attendanceStatsData.filter(item => item.status === 0).length;
            const rate = total > 0 ? (normal * 100.0 / total) : 0;
            
            document.getElementById('totalDays').textContent = total;
            document.getElementById('normalDays').textContent = normal;
            document.getElementById('lateDays').textContent = late;
            document.getElementById('attendanceRate').textContent = rate.toFixed(1) + '%';
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 调用后端 API 清除 Session
                fetch('/student/api/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
                    }
                }).catch(err => console.error('退出登录失败', err));
                
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                localStorage.removeItem('userRole');
                localStorage.removeItem('loginTime');
                localStorage.removeItem('studentId');
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
