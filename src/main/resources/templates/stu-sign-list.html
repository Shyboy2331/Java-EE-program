<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的打卡记录 - 考勤系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .navbar-brand {
            color: #667eea;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: #667eea;
            color: white;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .page-header h1 {
            color: #333;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-bar input,
        .search-bar select {
            padding: 12px 18px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 14px;
            min-width: 180px;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
        }

        .sign-table {
            width: 100%;
            border-collapse: collapse;
        }

        .sign-table th,
        .sign-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .sign-table th {
            background: #f8f9fa;
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }

        .sign-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.normal {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.late {
            background: #fff3e0;
            color: #f57c00;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state .btn {
            display: inline-block;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .empty-state .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 12px;
            flex: 1;
            min-width: 140px;
        }

        .stat-item .value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-item .label {
            font-size: 13px;
            opacity: 0.9;
        }

        .remark-cell {
            max-width: 200px;
            color: #666;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="/student/homepage" class="navbar-brand">
                <span>📚</span>
                <span>学生考勤系统</span>
            </a>
            <div class="nav-links">
                <a href="/student/homepage">首页</a>
                <a href="/student/sign-in">打卡签到</a>
                <a href="/student/course/select">选择课程</a>
                <a href="/student/ask-for-leave">请假申请</a>
                <a href="/student/sign-records" class="active">打卡记录</a>
            </div>
        </nav>

        <div class="content-card">
            <div class="page-header">
                <h1>
                    <span>📋</span>
                    <span>我的打卡记录</span>
                </h1>
                <a href="/student/sign-in" class="back-btn">
                    <span>📍</span>
                    <span>去打卡</span>
                </a>
            </div>

            <!-- 统计信息 -->
            <div class="stats-row">
                <div class="stat-item">
                    <div class="value" id="totalSigns">0</div>
                    <div class="label">总打卡数</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="normalSigns">0</div>
                    <div class="label">正常打卡</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="lateSigns">0</div>
                    <div class="label">迟到</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="normalRate">0%</div>
                    <div class="label">出勤率</div>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchCourse" placeholder="课程名称..." />
                <select id="searchStatus">
                    <option value="">全部状态</option>
                    <option value="1">正常</option>
                    <option value="0">迟到</option>
                </select>
                <input type="date" id="searchDate" />
                <button class="search-btn" onclick="search()">🔍 搜索</button>
            </div>

            <div class="table-container">
                <table class="sign-table">
                    <thead>
                        <tr>
                            <th>课程</th>
                            <th>打卡时间</th>
                            <th>状态</th>
                            <th>IP 地址</th>
                            <th>备注</th>
                        </tr>
                    </thead>
                    <tbody id="signTableBody">
                        <!-- 数据由 JS 动态加载 -->
                    </tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="icon">📋</div>
                <p>暂无打卡记录</p>
                <a href="/student/sign-in" class="btn">立即打卡</a>
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];

        // 加载打卡记录
        async function loadSignRecords() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                showEmptyState();
                return;
            }

            try {
                const user = JSON.parse(userStr);
                const studentId = user.studentId || user.id || user.username || '';

                if (!studentId) {
                    showEmptyState();
                    return;
                }

                const response = await fetch(`/student/api/sign/history?studentId=${encodeURIComponent(studentId)}`);
                const result = await response.json();
                
                if (result.code === 200 && result.data && result.data.length > 0) {
                    allRecords = result.data;
                    renderTable(allRecords);
                    updateStats(allRecords);
                } else {
                    // 使用模拟数据
                    loadMockData();
                }
            } catch (error) {
                console.error('加载数据失败', error);
                loadMockData();
            }
        }

        // 显示空状态
        function showEmptyState() {
            document.querySelector('.stats-row').style.display = 'none';
            document.querySelector('.search-bar').style.display = 'none';
            document.querySelector('.sign-table').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }

        // 加载模拟数据
        function loadMockData() {
            allRecords = [
                { courseName: '计算机科学与技术', signTime: '2026-05-20T07:55:00', status: 1, statusDesc: '正常', signIp: '192.168.1.101', remark: '' },
                { courseName: '高等数学', signTime: '2026-05-20T08:05:00', status: 0, statusDesc: '迟到', signIp: '192.168.1.102', remark: '路上堵车' },
                { courseName: '大学英语', signTime: '2026-05-19T07:50:00', status: 1, statusDesc: '正常', signIp: '192.168.1.103', remark: '' },
                { courseName: '数据结构', signTime: '2026-05-19T07:58:00', status: 1, statusDesc: '正常', signIp: '192.168.1.104', remark: '' },
                { courseName: '操作系统', signTime: '2026-05-18T08:20:00', status: 0, statusDesc: '迟到', signIp: '192.168.1.105', remark: '闹钟没响' }
            ];
            renderTable(allRecords);
            updateStats(allRecords);
        }

        // 渲染表格
        function renderTable(records) {
            const tbody = document.getElementById('signTableBody');
            const emptyState = document.getElementById('emptyState');
            const table = document.querySelector('.sign-table');

            if (records.length === 0) {
                emptyState.style.display = 'block';
                table.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            table.style.display = 'table';

            tbody.innerHTML = records.map(record => `
                <tr>
                    <td>${record.courseName || '-'}</td>
                    <td>${formatTime(record.signTime)}</td>
                    <td>
                        <span class="status-badge ${record.status === 1 ? 'normal' : 'late'}">
                            ${record.statusDesc || (record.status === 1 ? '正常' : '迟到')}
                        </span>
                    </td>
                    <td>${record.signIp || '-'}</td>
                    <td class="remark-cell" title="${record.remark || ''}">${record.remark || '-'}</td>
                </tr>
            `).join('');
        }

        // 格式化时间
        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const date = new Date(timeStr.replace('T', ' '));
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 更新统计
        function updateStats(records) {
            const total = records.length;
            const normal = records.filter(r => r.status === 1).length;
            const late = records.filter(r => r.status === 0).length;
            const rate = total > 0 ? Math.round((normal / total) * 100) : 0;

            document.getElementById('totalSigns').textContent = total;
            document.getElementById('normalSigns').textContent = normal;
            document.getElementById('lateSigns').textContent = late;
            document.getElementById('normalRate').textContent = rate + '%';
        }

        // 搜索功能
        function search() {
            const courseName = document.getElementById('searchCourse').value.toLowerCase();
            const status = document.getElementById('searchStatus').value;
            const date = document.getElementById('searchDate').value;

            const filtered = allRecords.filter(record => {
                const matchCourse = !courseName || (record.courseName && record.courseName.toLowerCase().includes(courseName));
                const matchStatus = !status || record.status.toString() === status;
                const matchDate = !date || (record.signTime && record.signTime.startsWith(date));
                return matchCourse && matchStatus && matchDate;
            });

            renderTable(filtered);
            updateStats(filtered);
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadSignRecords();
        });
    </script>
</body>
</html>
