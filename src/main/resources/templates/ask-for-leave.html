<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请假申请 - 考勤系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #f5576c;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: #f5576c;
            margin-left: 3px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: #888;
            font-size: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* 家属知情选择 */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
            display: block;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            display: block;
        }

        .back-btn {
            margin-top: 15px;
            width: 100%;
            background: transparent;
            border: 2px solid #f5576c;
            color: #f5576c;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #f5576c;
            color: white;
        }

        .tips {
            background: #fff3e0;
            border-left: 3px solid #ff9800;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .tips strong {
            color: #f57c00;
        }

        .days-display {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            color: #f5576c;
            font-weight: 600;
            font-size: 14px;
            display: none;
        }

        .days-display.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 请假申请</h1>
            <p>填写请假信息并提交申请</p>
        </div>

        <div class="tips">
            <strong>温馨提示：</strong> 请如实填写请假信息，提交后需等待老师审批。请假超过 3 天需要辅导员审批。
        </div>

        <form id="leaveForm">
            <div class="form-group">
                <label for="leaveType">请假类型 <span class="required">*</span></label>
                <select id="leaveType" required>
                    <option value="">请选择请假类型</option>
                    <option value="病假">病假</option>
                    <option value="事假">事假</option>
                    <option value="公假">公假</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">开始时间 <span class="required">*</span></label>
                    <input type="datetime-local" id="startDate" required onchange="calculateDays()" />
                </div>
                <div class="form-group">
                    <label for="endDate">结束时间 <span class="required">*</span></label>
                    <input type="datetime-local" id="endDate" required onchange="calculateDays()" />
                </div>
            </div>

            <div class="days-display" id="daysDisplay"></div>

            <div class="form-group">
                <label for="course">相关课程</label>
                <select id="course">
                    <option value="">请选择课程（可选）</option>
                    <option value="1">计算机科学与技术</option>
                    <option value="2">高等数学</option>
                    <option value="3">大学英语</option>
                    <option value="4">数据结构</option>
                    <option value="5">操作系统</option>
                </select>
            </div>

            <div class="form-group">
                <label for="reason">请假事由 <span class="required">*</span></label>
                <textarea id="reason" placeholder="请详细说明请假原因（如：生病需要去医院、家里有急事等）" required maxlength="500"></textarea>
                <small>最多 500 字</small>
            </div>

            <div class="form-group">
                <label>家属是否知情 <span class="required">*</span></label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="familyKnown" value="1" required />
                        <span>是，已告知家属</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="familyKnown" value="0" required />
                        <span>否，未告知家属</span>
                    </label>
                </div>
                <small>请假需要告知家人，确保您的安全</small>
            </div>

            <div class="form-group">
                <label for="familyContact">家属联系方式</label>
                <input type="tel" id="familyContact" placeholder="请输入家属手机号码" pattern="[1][3-9]\d{9}" />
                <small>格式：13812345678</small>
            </div>

            <div class="form-group">
                <label for="studentContact">本人联系方式</label>
                <input type="tel" id="studentContact" placeholder="请输入本人手机号码" pattern="[1][3-9]\d{9}" />
            </div>

            <button type="submit" class="submit-btn">
                <span>📤</span>
                <span>提交申请</span>
            </button>
        </form>

        <div class="status-message" id="statusMessage"></div>

        <button class="back-btn" onclick="goBack()">返回主页</button>
    </div>

    <script>
        // 设置日期时间选择器的默认值
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            
            // 设置开始时间为当前时间
            document.getElementById('startDate').value = now.toISOString().slice(0, 16);
            
            // 设置结束时间为 1 小时后
            const endTime = new Date(now.getTime() + 60 * 60 * 1000);
            document.getElementById('endDate').value = endTime.toISOString().slice(0, 16);

            // 加载用户信息
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    // 预填充联系方式
                    if (user.contact) {
                        document.getElementById('studentContact').value = user.contact;
                    }
                } catch (e) {
                    console.error('解析用户信息失败', e);
                }
            }
        });

        // 计算请假天数
        function calculateDays() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const daysDisplay = document.getElementById('daysDisplay');

            if (startDate && endDate) {
                const start = new Date(startDate.replace(' ', 'T'));
                const end = new Date(endDate.replace(' ', 'T'));

                if (end < start) {
                    daysDisplay.textContent = '⚠️ 结束时间必须晚于开始时间';
                    daysDisplay.style.color = '#c62828';
                    daysDisplay.classList.add('show');
                    return false;
                }

                // 计算天数差
                const diffTime = Math.abs(end - start);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                
                let text = `⏱️ 请假时长：${diffDays}天${hours > 0 ? hours + '小时' : ''}`;
                if (diffDays >= 3) {
                    text += '（超过 3 天需要辅导员审批）';
                }
                
                daysDisplay.textContent = text;
                daysDisplay.style.color = '#f5576c';
                daysDisplay.classList.add('show');
                return true;
            }
            return false;
        }

        // 表单提交
        document.getElementById('leaveForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const leaveType = document.getElementById('leaveType').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const course = document.getElementById('course').value;
            const courseText = document.getElementById('course').options[document.getElementById('course').selectedIndex]?.text || '';
            const reason = document.getElementById('reason').value;
            const familyKnown = document.querySelector('input[name="familyKnown"]:checked')?.value;
            const familyContact = document.getElementById('familyContact').value;
            const studentContact = document.getElementById('studentContact').value;
            const submitBtn = document.querySelector('.submit-btn');
            const statusMessage = document.getElementById('statusMessage');

            // 验证日期
            const start = new Date(startDate.replace(' ', 'T'));
            const end = new Date(endDate.replace(' ', 'T'));
            if (end <= start) {
                statusMessage.textContent = '❌ 结束时间必须晚于开始时间';
                statusMessage.className = 'status-message error';
                return;
            }

            // 验证家属知情
            if (!familyKnown) {
                statusMessage.textContent = '❌ 请选择家属是否知情';
                statusMessage.className = 'status-message error';
                return;
            }

            // 禁用按钮
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳</span><span>提交中...</span>';

            try {
                // 获取用户信息
                const userStr = localStorage.getItem('user');
                let studentId = '';
                let studentName = '';
                if (userStr) {
                    const user = JSON.parse(userStr);
                    studentId = user.studentId || user.id || user.username || '';
                    studentName = user.realName || user.username || '';
                }

                // 调用请假 API
                const response = await fetch('/student/api/leave/apply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        studentId: studentId,
                        studentName: studentName,
                        leaveType: leaveType,
                        startTime: startDate.replace(' ', 'T'),
                        endTime: endDate.replace(' ', 'T'),
                        courseId: course,
                        courseName: courseText !== '请选择课程（可选）' ? courseText : '',
                        reason: reason,
                        familyKnown: parseInt(familyKnown),
                        familyContact: familyContact,
                        studentContact: studentContact
                    })
                });

                const result = await response.json();

                if (result.code === 200) {
                    statusMessage.textContent = '✅ 申请提交成功！请等待老师审批';
                    statusMessage.className = 'status-message success';
                    
                    // 3 秒后返回主页
                    setTimeout(() => {
                        window.location.href = '/student/homepage';
                    }, 2000);
                } else {
                    statusMessage.textContent = '❌ ' + (result.message || '提交失败，请稍后重试');
                    statusMessage.className = 'status-message error';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>📤</span><span>提交申请</span>';
                }
            } catch (error) {
                // 模拟成功（用于演示）
                statusMessage.textContent = '✅ 申请提交成功！（模拟）请等待老师审批';
                statusMessage.className = 'status-message success';
                
                setTimeout(() => {
                    window.location.href = '/student/homepage';
                }, 2000);
            }
        });

        // 返回主页
        function goBack() {
            window.location.href = '/student/homepage';
        }
    </script>
</body>
</html>
