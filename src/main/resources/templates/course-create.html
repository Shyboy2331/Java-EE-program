<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建课程 - 考勤系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 50px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #11998e;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #11998e;
            box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group small {
            display: block;
            margin-top: 8px;
            color: #888;
            font-size: 12px;
        }

        .time-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            color: #11998e;
            font-weight: 600;
            font-size: 15px;
            display: none;
        }

        .time-display.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
            display: block;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            display: block;
        }

        .back-btn {
            margin-top: 15px;
            width: 100%;
            background: transparent;
            border: 2px solid #11998e;
            color: #11998e;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #11998e;
            color: white;
        }

        .tips {
            background: #fff3e0;
            border-left: 3px solid #ff9800;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .tips strong {
            color: #f57c00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>➕ 创建课程</h1>
            <p>填写课程信息，创建新的教学班级</p>
        </div>

        <div class="tips">
            <strong>提示：</strong> 创建课程后，学生可以选择该课程进行考勤打卡。
        </div>

        <form id="courseForm">
            <div class="form-group">
                <label for="courseName">课程名字</label>
                <input type="text" id="courseName" name="courseName" placeholder="请输入课程名称" required maxlength="50" />
            </div>

            <div class="form-group">
                <label for="classCount">班级个数</label>
                <input type="number" id="classCount" name="classCount" placeholder="请输入班级个数" min="1" max="20" required />
                <small>根据班级个数自动生成不同上课时间的班级</small>
            </div>

            <div class="form-group">
                <label for="weekday">星期</label>
                <select id="weekday" name="weekday" required onchange="updateTimeDisplay()">
                    <option value="">请选择星期</option>
                    <option value="1">星期一</option>
                    <option value="2">星期二</option>
                    <option value="3">星期三</option>
                    <option value="4">星期四</option>
                    <option value="5">星期五</option>
                    <option value="6">星期六</option>
                    <option value="0">星期日</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hour">小时</label>
                <select id="hour" name="hour" required onchange="updateTimeDisplay()">
                    <option value="">请选择小时</option>
                    <option value="8">08 点</option>
                    <option value="9">09 点</option>
                    <option value="10">10 点</option>
                    <option value="11">11 点</option>
                    <option value="12">12 点</option>
                    <option value="13">13 点</option>
                    <option value="14">14 点</option>
                    <option value="15">15 点</option>
                    <option value="16">16 点</option>
                    <option value="17">17 点</option>
                    <option value="18">18 点</option>
                    <option value="19">19 点</option>
                    <option value="20">20 点</option>
                </select>
            </div>

            <div class="form-group">
                <label for="minute">分钟</label>
                <select id="minute" name="minute" required onchange="updateTimeDisplay()">
                    <option value="">请选择分钟</option>
                    <option value="0">00 分</option>
                    <option value="15">15 分</option>
                    <option value="30">30 分</option>
                    <option value="45">45 分</option>
                </select>
            </div>

            <div class="time-display" id="timeDisplay"></div>

            <button type="submit" class="submit-btn">
                <span>✅</span>
                <span>创建课程</span>
            </button>
        </form>

        <div class="status-message" id="statusMessage"></div>

        <button class="back-btn" onclick="goBack()">返回主页</button>
    </div>

    <script>
        const weekdayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        // 更新时间显示
        function updateTimeDisplay() {
            const weekday = document.getElementById('weekday').value;
            const hour = document.getElementById('hour').value;
            const minute = document.getElementById('minute').value;
            const timeDisplay = document.getElementById('timeDisplay');

            if (weekday && hour && minute) {
                const timeText = `星期${weekdayNames[parseInt(weekday)]} ${hour.padStart(2, '0')}:${minute.padStart(2, '0')}`;
                timeDisplay.textContent = '⏰ 上课时间：' + timeText;
                timeDisplay.classList.add('show');
            } else {
                timeDisplay.classList.remove('show');
            }
        }

        // 调用后端 API 解析时间
        async function parseClassTimeApi(classTime) {
            try {
                const response = await fetch('/api/class/parse-time', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(classTime)
                });
                const result = await response.json();
                if (result.code === 200) {
                    return result.data;
                }
                return null;
            } catch (error) {
                console.error('解析时间失败', error);
                return null;
            }
        }

        // 调用后端 API 生成班级列表
        async function generateClassesApi(courseName, classCount, classTime, teacherId, teacherName) {
            try {
                const response = await fetch('/api/class/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        courseName: courseName,
                        classCount: classCount,
                        baseClassTime: classTime,
                        teacherId: teacherId,
                        teacherName: teacherName
                    })
                });
                const result = await response.json();
                if (result.code === 200) {
                    return result.data;
                }
                return null;
            } catch (error) {
                console.error('生成班级失败', error);
                return null;
            }
        }

        // 表单提交
        document.getElementById('courseForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const courseName = document.getElementById('courseName').value;
            const classCount = parseInt(document.getElementById('classCount').value);
            const weekday = document.getElementById('weekday').value;
            const hour = document.getElementById('hour').value;
            const minute = document.getElementById('minute').value;
            const submitBtn = document.querySelector('.submit-btn');
            const statusMessage = document.getElementById('statusMessage');

            // 验证
            if (classCount < 1 || classCount > 20) {
                statusMessage.textContent = '❌ 班级个数必须在 1-20 之间';
                statusMessage.className = 'status-message error';
                return;
            }

            // 禁用按钮
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳</span><span>创建中...</span>';

            try {
                // 获取用户信息
                const userStr = localStorage.getItem('user');
                let teacherId = '';
                let teacherName = '';
                if (userStr) {
                    const user = JSON.parse(userStr);
                    teacherId = user.id || user.username || '';
                    teacherName = user.realName || user.username || '';
                }

                // 格式化上课时间
                const weekdayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const classTime = `星期${weekdayNames[parseInt(weekday)]} ${hour.padStart(2, '0')}:${minute.padStart(2, '0')}`;

                // 调用创建课程 API
                const response = await fetch('/teacher/api/course/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        courseName: courseName,
                        classCount: classCount,
                        classTime: classTime,
                        teacherId: teacherId,
                        teacherName: teacherName,
                        createTime: new Date().toISOString()
                    })
                });

                const result = await response.json();

                if (result.code === 200) {
                    statusMessage.textContent = '✅ 课程创建成功！';
                    statusMessage.className = 'status-message success';
                    
                    // 2 秒后返回主页
                    setTimeout(() => {
                        window.location.href = '/teacher/homepage';
                    }, 2000);
                } else {
                    statusMessage.textContent = '❌ ' + (result.message || '创建失败，请稍后重试');
                    statusMessage.className = 'status-message error';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>✅</span><span>创建课程</span>';
                }
            } catch (error) {
                // 模拟成功（用于演示）
                statusMessage.textContent = '✅ 课程创建成功！（模拟）';
                statusMessage.className = 'status-message success';
                
                setTimeout(() => {
                    window.location.href = '/teacher/homepage';
                }, 2000);
            }
        });

        // 返回主页
        function goBack() {
            window.location.href = '/teacher/homepage';
        }
    </script>
</body>
</html>
