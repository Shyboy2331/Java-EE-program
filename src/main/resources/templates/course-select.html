<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择课程 - 考勤系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
            cursor: pointer;
        }

        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group select:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .form-group small {
            display: block;
            margin-top: 8px;
            color: #888;
            font-size: 12px;
        }

        .class-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .class-info.show {
            display: block;
        }

        .class-info .title {
            color: #667eea;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .class-info .detail {
            color: #333;
            font-size: 14px;
            line-height: 1.8;
        }

        .class-info .detail strong {
            color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
            display: block;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            display: block;
        }

        .back-btn {
            margin-top: 15px;
            width: 100%;
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
        }

        .tips {
            background: #e3f2fd;
            border-left: 3px solid #2196f3;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .tips strong {
            color: #1976d2;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            display: none;
        }

        .empty-state.show {
            display: block;
        }

        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 选择课程</h1>
            <p>选择你要修读的课程和班级</p>
        </div>

        <div class="tips">
            <strong>提示：</strong> 选择课程后才能进行考勤打卡，请仔细选择上课班级。
        </div>

        <form id="courseSelectForm">
            <div class="form-group">
                <label for="courseSelect">课程列表</label>
                <select id="courseSelect" required onchange="onCourseChange()">
                    <option value="">请选择课程</option>
                    <option value="1">计算机科学与技术</option>
                    <option value="2">高等数学</option>
                    <option value="3">大学英语</option>
                    <option value="4">数据结构</option>
                    <option value="5">操作系统</option>
                </select>
            </div>

            <div class="form-group">
                <label for="classSelect">上课班级</label>
                <select id="classSelect" required disabled onchange="onClassChange()">
                    <option value="">请先选择课程</option>
                </select>
                <small>根据课程的上课时间分类显示</small>
            </div>

            <div class="class-info" id="classInfo">
                <div class="title">📋 班级信息</div>
                <div class="detail" id="classDetail"></div>
            </div>

            <div class="empty-state" id="emptyState">
                <div class="icon">📚</div>
                <p>暂无可选课程</p>
            </div>

            <button type="submit" class="submit-btn">
                <span>✅</span>
                <span>确认选择</span>
            </button>
        </form>

        <div class="status-message" id="statusMessage"></div>

        <button class="back-btn" onclick="goBack()">返回主页</button>
    </div>

    <script>
        // 存储课程和班级数据
        let coursesData = {};

        // 加载课程数据
        async function loadCourses() {
            try {
                const response = await fetch('/student/api/course/list?studentId=');
                // 这里需要从 localStorage 获取学生 ID
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    const studentId = user.studentId || user.id || user.username || '';
                    const coursesResponse = await fetch(`/student/api/course/list?studentId=${encodeURIComponent(studentId)}`);
                    const result = await coursesResponse.json();
                    
                    if (result.code === 200 && result.data) {
                        // 将选课数据转换为课程和班级格式
                        result.data.forEach(sc => {
                            if (!coursesData[sc.courseId]) {
                                coursesData[sc.courseId] = {
                                    name: sc.courseName,
                                    classes: []
                                };
                            }
                            coursesData[sc.courseId].classes.push({
                                id: sc.classId,
                                time: sc.classTime,
                                teacher: '待定',
                                location: '待定'
                            });
                        });
                        populateCourseSelect();
                    }
                }
            } catch (error) {
                console.error('加载课程失败', error);
                // 使用模拟数据
                loadMockCourses();
            }
        }

        // 加载模拟课程数据（用于演示）
        function loadMockCourses() {
            coursesData = {
                '1': {
                    name: '计算机科学与技术',
                    classes: [
                        { id: '1-1', time: '星期一 08:00', teacher: '张老师', location: '教学楼 A101' },
                        { id: '1-2', time: '星期一 10:00', teacher: '张老师', location: '教学楼 A102' },
                        { id: '1-3', time: '星期三 14:00', teacher: '李老师', location: '教学楼 B201' }
                    ]
                },
                '2': {
                    name: '高等数学',
                    classes: [
                        { id: '2-1', time: '星期二 08:00', teacher: '王教授', location: '教学楼 C301' },
                        { id: '2-2', time: '星期二 10:00', teacher: '王教授', location: '教学楼 C302' },
                        { id: '2-3', time: '星期四 14:00', teacher: '赵老师', location: '教学楼 D101' }
                    ]
                },
                '3': {
                    name: '大学英语',
                    classes: [
                        { id: '3-1', time: '星期三 08:00', teacher: '刘老师', location: '语言楼 201' },
                        { id: '3-2', time: '星期五 10:00', teacher: '陈老师', location: '语言楼 202' }
                    ]
                },
                '4': {
                    name: '数据结构',
                    classes: [
                        { id: '4-1', time: '星期一 14:00', teacher: '孙老师', location: '计算机楼 301' },
                        { id: '4-2', time: '星期四 10:00', teacher: '孙老师', location: '计算机楼 302' }
                    ]
                },
                '5': {
                    name: '操作系统',
                    classes: [
                        { id: '5-1', time: '星期二 14:00', teacher: '周老师', location: '计算机楼 401' },
                        { id: '5-2', time: '星期五 08:00', teacher: '周老师', location: '计算机楼 402' }
                    ]
                }
            };
            populateCourseSelect();
        }

        // 填充课程选择框
        function populateCourseSelect() {
            const select = document.getElementById('courseSelect');
            select.innerHTML = '<option value="">请选择课程</option>';
            
            Object.keys(coursesData).forEach(courseId => {
                const course = coursesData[courseId];
                const option = document.createElement('option');
                option.value = courseId;
                option.textContent = course.name;
                select.appendChild(option);
            });
        }

        // 课程变化时更新班级列表
        function onCourseChange() {
            const courseSelect = document.getElementById('courseSelect');
            const classSelect = document.getElementById('classSelect');
            const classInfo = document.getElementById('classInfo');
            const courseId = courseSelect.value;

            // 重置班级选择
            classSelect.innerHTML = '<option value="">请选择班级</option>';
            classSelect.disabled = true;
            classInfo.classList.remove('show');

            if (courseId && coursesData[courseId]) {
                const course = coursesData[courseId];

                // 按上课时间分类填充班级选项
                course.classes.forEach(cls => {
                    const option = document.createElement('option');
                    option.value = cls.id;
                    option.textContent = `${cls.time} - ${cls.teacher}`;
                    classSelect.appendChild(option);
                });

                classSelect.disabled = false;
            }
        }

        // 班级变化时显示详细信息
        function onClassChange() {
            const courseSelect = document.getElementById('courseSelect');
            const classSelect = document.getElementById('classSelect');
            const classInfo = document.getElementById('classInfo');
            const classDetail = document.getElementById('classDetail');
            const courseId = courseSelect.value;
            const classId = classSelect.value;

            if (courseId && classId && coursesData[courseId]) {
                const cls = coursesData[courseId].classes.find(c => c.id === classId);
                if (cls) {
                    classDetail.innerHTML = `
                        <div><strong>课程名称：</strong>${coursesData[courseId].name}</div>
                        <div><strong>上课时间：</strong>${cls.time}</div>
                        <div><strong>授课教师：</strong>${cls.teacher}</div>
                        <div><strong>上课地点：</strong>${cls.location}</div>
                    `;
                    classInfo.classList.add('show');
                }
            } else {
                classInfo.classList.remove('show');
            }
        }

        // 表单提交
        document.getElementById('courseSelectForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const courseSelect = document.getElementById('courseSelect');
            const classSelect = document.getElementById('classSelect');
            const courseId = courseSelect.value;
            const classId = classSelect.value;
            const submitBtn = document.querySelector('.submit-btn');
            const statusMessage = document.getElementById('statusMessage');

            if (!courseId) {
                statusMessage.textContent = '❌ 请先选择课程';
                statusMessage.className = 'status-message error';
                return;
            }

            if (!classId) {
                statusMessage.textContent = '❌ 请先选择班级';
                statusMessage.className = 'status-message error';
                return;
            }

            // 禁用按钮
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳</span><span>选择中...</span>';

            try {
                // 获取用户信息
                const userStr = localStorage.getItem('user');
                let studentId = '';
                let studentName = '';
                if (userStr) {
                    const user = JSON.parse(userStr);
                    studentId = user.studentId || user.id || user.username || '';
                    studentName = user.realName || user.username || '';
                }

                // 调用选择课程 API
                const response = await fetch('/student/api/course/select', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        studentId: studentId,
                        studentName: studentName,
                        courseId: courseId,
                        classId: classId,
                        selectTime: new Date().toISOString()
                    })
                });

                const result = await response.json();

                if (result.code === 200) {
                    statusMessage.textContent = '✅ 课程选择成功！';
                    statusMessage.className = 'status-message success';
                    
                    // 2 秒后返回主页
                    setTimeout(() => {
                        window.location.href = '/student/homepage';
                    }, 2000);
                } else {
                    statusMessage.textContent = '❌ ' + (result.message || '选择失败，请稍后重试');
                    statusMessage.className = 'status-message error';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>✅</span><span>确认选择</span>';
                }
            } catch (error) {
                // 模拟成功（用于演示）
                const courseName = courseData[courseId]?.name || '未知课程';
                const cls = courseData[courseId]?.classes.find(c => c.id === classId);
                const timeText = cls ? cls.time : '';
                
                statusMessage.textContent = `✅ 课程选择成功！（模拟）\n已选择：${courseName} - ${timeText}`;
                statusMessage.className = 'status-message success';
                
                setTimeout(() => {
                    window.location.href = '/student/homepage';
                }, 2000);
            }
        });

        // 返回主页
        function goBack() {
            window.location.href = '/student/homepage';
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadCourses();
        });
    </script>
</body>
</html>
